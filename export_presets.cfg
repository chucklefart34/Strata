; iOS export preset for Strata. Open the project in Godot 4.7.2 on a Mac,
; install the iOS export templates, fill in your Apple Team ID and a bundle
; identifier you own (Project › Export… › iOS), then export. See BUILD_IOS.md.
; Godot fills in any option missing here with its default.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, renders/*, *.md"
export_path="build/ios/Strata.ipa"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
architectures/arm64=true
application/app_store_team_id=""
application/export_method_debug=1
application/export_method_release=1
application/bundle_identifier="com.example.strata"
application/signature=""
application/short_version="0.1.0"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=2
application/export_project_only=false
application/delete_old_export_files_unconditionally=false
application/generate_simulator_library_if_missing=true
capabilities/access_wifi=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=true
user_data/accessible_from_files_app=true
user_data/accessible_from_itunes_sharing=true
privacy/camera_usage_description="Strata uses the camera to shoot stop-motion frames."
privacy/camera_usage_description_localized={}
privacy/photolibrary_usage_description="Strata can add photos from your library as frames and images."
privacy/photolibrary_usage_description_localized={}
icons/icon_1024x1024=""
icons/settings_58x58=""
icons/settings_87x87=""
icons/notification_40x40=""
icons/notification_60x60=""
icons/spotlight_80x80=""
icons/spotlight_120x120=""
icons/iphone_120x120=""
icons/iphone_180x180=""
icons/ipad_76x76=""
icons/ipad_152x152=""
icons/ipad_167x167=""
storyboard/image_scale_mode=0
storyboard/custom_image@2x=""
storyboard/custom_image@3x=""
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.0745, 0.0784, 0.0941, 1)
