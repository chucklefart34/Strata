name: Build apps (Windows + iOS)

# Every push to main (or "Run workflow" in the Actions tab):
#   1. checks that every script and shader compiles,
#   2. builds Strata.exe for Windows (with FFmpeg bundled) → "Windows build" release,
#   3. builds an UNSIGNED Strata.ipa for iPad/iPhone → "iOS build" release
#      (install with Sideloadly or AltStore; see BUILD_IOS.md).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Godot version to build with"
        default: "4.7.2"
        required: true

permissions:
  contents: write

concurrency:
  group: app-builds
  cancel-in-progress: true

env:
  GODOT_VERSION: ${{ github.event.inputs.godot_version || '4.7.2' }}

jobs:
  check:
    name: Launch check (script errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot (Linux)
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${V}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import, compile everything, and launch headless
        run: |
          "$GODOT" --headless --path . --import > import.log 2>&1 || true
          timeout 120 "$GODOT" --headless --path . --script res://tools/ci_check.gd > compile.log 2>&1 || true
          timeout 120 "$GODOT" --headless --path . --quit-after 240 > run.log 2>&1 || true
          tail -n 3 compile.log
          cat import.log compile.log run.log | grep -E "SCRIPT ERROR|SHADER ERROR|Parse Error|CHECK FAILED|Failed to load|Compile Error|ERROR:" -A4 | head -n 300 || true
          if grep -qE "SCRIPT ERROR|SHADER ERROR|Parse Error|CHECK FAILED|Failed to load script|Compile Error|Shader compilation failed" import.log compile.log run.log; then
            echo "::error::Script or shader errors found (see above)"
            exit 1
          fi

  windows:
    name: Windows (.exe)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and its export templates
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          curl -fsSL --retry 3 -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          curl -fsSL --retry 3 -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          unzip -q -j templates.tpz "templates/windows_*" "templates/version.txt" -d "$TDIR"
          ls "$TDIR"
          echo "GODOT=$PWD/Godot_v${V}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Stamp the build number
        run: |
          printf 'class_name BuildInfo\nconst BUILD := %s\nconst COMMIT := "%s"\nconst DATE := "%s"\n' "${{ github.run_number }}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%d)" > core/build_info.gd
          printf '{"build": %s, "commit": "%s", "date": "%s"}\n' "${{ github.run_number }}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%d)" > version.json
          cat core/build_info.gd version.json

      - name: Export Strata.exe
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import > import.log 2>&1 || true
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows" build/windows/Strata.exe
          ls -lh build/windows

      - name: Bundle FFmpeg (video import and MP4 export)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -q ffmpeg.zip -d ffmpeg_src
          SRC=$(dirname "$(find ffmpeg_src -name ffmpeg.exe | head -n 1)")
          mkdir -p build/windows/ffmpeg
          cp "$SRC/ffmpeg.exe" build/windows/ffmpeg/
          cp "$(find ffmpeg_src -iname 'LICENSE*' | head -n 1)" build/windows/ffmpeg/LICENSE.txt
          cat > build/windows/README.txt <<'TXT'
          Strata Animation Studio for Windows
          ===================================
          Double-click Strata.exe to start. Keep the "ffmpeg" folder next to it:
          Strata uses it to import videos and to export MP4, MOV and GIF.

          Windows may warn that the app is from an unknown publisher (it isn't
          code-signed). Choose "More info" > "Run anyway".

          FFmpeg (ffmpeg/ffmpeg.exe) is a separate program from https://ffmpeg.org,
          built by https://github.com/BtbN/FFmpeg-Builds and licensed under the
          GPL (see ffmpeg/LICENSE.txt). Its source is available from those sites.
          TXT
          sed -i 's/^          //' build/windows/README.txt
          cd build/windows && zip -qr ../Strata-windows.zip Strata.exe ffmpeg README.txt && ls -lh ../Strata-windows.zip

      - name: Upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Strata-windows
          path: build/Strata-windows.zip
          if-no-files-found: error

      - name: Publish to the "Windows build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest build/Strata-windows.zip version.json \
            --title "Windows build — ${GITHUB_SHA::7}" \
            --notes "Strata for Windows (64-bit), built $(date -u +%Y-%m-%d). Unzip and run Strata.exe; keep the ffmpeg folder next to it." \
            --prerelease --target "$GITHUB_SHA"

  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode (Godot 4.7 needs the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)(.*)\.app/\1 &/' | sort -V | tail -n 1 | cut -d' ' -f2-)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Download Godot and its export templates
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          echo "Downloading Godot ${V}"
          curl -fsSL --retry 3 -o godot.zip "${BASE}/Godot_v${V}_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL --retry 3 -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          TDIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          unzip -q templates.tpz
          mv templates/* "$TDIR/"
          ls "$TDIR" | grep -i ios
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Stamp the build number
        run: |
          printf 'class_name BuildInfo\nconst BUILD := %s\nconst COMMIT := "%s"\nconst DATE := "%s"\n' "${{ github.run_number }}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%d)" > core/build_info.gd
          printf '{"build": %s, "commit": "%s", "date": "%s"}\n' "${{ github.run_number }}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%d)" > version.json
          cat core/build_info.gd version.json

      - name: Import the project
        run: |
          "$GODOT" --headless --path . --import || "$GODOT" --headless --path . --editor --quit-after 300 || true
          test -d .godot

      - name: Export the Xcode project from Godot
        run: |
          set -euo pipefail
          # CI exports the Xcode project only; signing is skipped below.
          sed -i '' 's/^application\/export_project_only=.*/application\/export_project_only=true/' export_presets.cfg
          sed -i '' 's/^application\/app_store_team_id=.*/application\/app_store_team_id="UNSIGNED00"/' export_presets.cfg
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Strata.ipa
          ls build/ios

      - name: Build the app with Xcode (unsigned)
        working-directory: build/ios
        run: |
          set -euo pipefail
          PROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{getline; gsub(/^ +/, ""); print; exit}')
          echo "Project: $PROJ  Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/Strata.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | tail -n 40
          APP=$(ls -d Strata.xcarchive/Products/Applications/*.app | head -n 1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Strata-unsigned.ipa Payload
          ls -lh Strata-unsigned.ipa

      - name: Upload the .ipa (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Strata-ios-unsigned
          path: build/ios/Strata-unsigned.ipa
          if-no-files-found: error

      - name: Publish to the "iOS build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest build/ios/Strata-unsigned.ipa version.json \
            --title "iOS build (unsigned) — ${GITHUB_SHA::7}" \
            --notes "Unsigned build of $(date -u +%Y-%m-%d). Install with Sideloadly or AltStore using your Apple ID (see BUILD_IOS.md)." \
            --prerelease --target "$GITHUB_SHA"
